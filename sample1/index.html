<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#777777">
<title>ミニゲーム</title>

<script id="game-config">
/* =====================================================================
   設定（ここを書き換えるだけで、別のお店・イベント用にできます）

   この見本を別のお店に使うときに変える所：
     1. shopName と eventName（店名とイベント名）
     2. colors（色。カードを濃くするときは、下の色の説明の注意を読む）
     3. art（スタート画面の星のマスコット。出さないときは "none"）
     4. ranks の title と prize（ランクの見出しと景品）。景品の金額は、お店で上限を確認してもらう
     5. texts の文（「星」「黒い雲」の呼び名など、変えたい物だけ）
     6. storageKey（お店ごとに別の名前にする）
     7. sampleNote を ""（空）にする。credit はお店の希望に合わせる
     ※ 点数・時間・出てくる速さ（points、timeLimit、spawn、combo）と ranks の min は、難しさの調整なので、そのままにする
     ※ ファイルの冒頭の <title> と theme-color も、お店の名前と色にしておく
   ===================================================================== */
const CONFIG = {
  // ---- お店・イベントの名前 ----
  shopName: "ほしのうたカフェ",        // 店名（画面の上に小さく表示）
  eventName: "星あつめチャレンジ",    // イベント名（ゲームのタイトルとして大きく表示）

  // ---- 色（"#rrggbb" の形で書きます） ----
  colors: {
    main: "#cc3361",        // メインの色（スタートボタン、タイトル文字、景品の枠）
    sub: "#6c63ff",         // サブの色（ゲージ、コンボ表示、文字の影）
    bgTop: "#2b2a6b",       // 背景グラデーションの上の色
    bgBottom: "#7a5cc7",    // 背景グラデーションの下の色
    finalTop: "#5a1e4a",    // 残りわずかのときの背景（上）
    finalBottom: "#ff7a59", // 残りわずかのときの背景（下）
    gold: "#ffc400",        // 金の星の色
    stars: ["#ff9fcb", "#7ee0c3", "#8ecbff", "#c9a7ff"], // ふつうの星の色（この中からランダム）
    // カード（スタート画面・結果画面の白い板）の色。カードを濃くしたら、ink・inkSoft・minus を明るくして、文字が読めるようにする
    // main（ボタン）や sub（店名の札）を明るい色にしたら、onColor を濃い色にする。札とボタンの両方で文字が読めるか確かめる
    card: "#ffffff",        // カードの地の色（少し透けて見えます）
    ink: "#2d2346",         // カードの上の文字の色
    inkSoft: "#4a3f66",     // カードの上の注意書き（架空のお店の見本です など）の色
    minus: "#5a4d7a",       // カードの上の、減点の数字（黒い雲の -30）の色
    onBg: "#ffffff",        // 背景の上の文字（スコアなどの表示、credit）の色。背景を明るくしたら濃い色にする
    onColor: "#ffffff"      // 色の付いたボタン・札（スタート、店名、景品）の上の文字の色
  },

  // ---- スタート画面の絵 ----
  // "star"（星のマスコット）か "none"（絵なし）。ほかの値のときは、絵なしになります
  art: "star",

  // ---- 時間 ----
  timeLimit: 30,     // 制限時間（秒）
  finalSeconds: 5,   // 残り何秒から「ラストスパート」の演出にするか（0 で演出なし）

  // ---- 点数（星と金の星を当てるとコンボが続きます。黒い雲は点数に関係なく、さわるとコンボが切れます） ----
  points: {
    star: 10,    // ふつうの星
    gold: 50,    // 金の星
    cloud: -30   // 黒い雲（減点。点数は 0 より下がりません。0 にすると点数は減らず、コンボが切れるだけになります）
  },

  // ---- コンボ（続けて星を当てたときのボーナス） ----
  combo: {
    step: 5,           // 何コンボごとに倍率が上がるか
    bonus: 0.5,        // 1段階で上がる倍率（0.5 なら ×1 → ×1.5 → ×2 …）
    maxMultiplier: 3   // 倍率の上限
  },

  // ---- 出てくる頻度と速さ ----
  spawn: {
    interval: 0.36,       // 何秒ごとに1つ出るか（ふだん）
    finalInterval: 0.3,   // 何秒ごとに1つ出るか（ラストスパート中）
    life: 0.9,            // 1つが画面にいる時間（秒・ふだん）。短いほど難しい
    finalLife: 0.75,      // 1つが画面にいる時間（秒・ラストスパート中）
    speed: 30,            // 動く速さの最大（1秒に何ピクセル・ふだん）。速いほど狙いにくい
    finalSpeed: 55,       // 動く速さの最大（1秒に何ピクセル・ラストスパート中）
    maxOnScreen: 6,      // 同時に出ている数の上限
    goldRate: 0.1,        // 金の星が出る割合（0.1 = 10%）
    cloudRate: 0.2        // 黒い雲が出る割合（0.2 = 20%）
  },

  // ---- 景品ランク（min 点以上でそのランク。上から順に高いランクを書く） ----
  // ※ 景品の金額には法律（景品表示法）の上限があります。景品はお店で上限を確認してから決めてください。
  // 制限時間を変えたら min も見直す（目安：30秒で全部当てると約2600点。星の9割で約2000点、8割で約1100点、6割で約550点、5割で約400点）
  // 一番下のランクの min は 0 にする（0点でも必ずどれかのランクになるように）
  // rank は1〜2文字にする（丸いバッジの中に入る長さ）
  ranks: [
    { rank: "S", min: 2200, color: "#ffb800", title: "星の達人！",       prize: "ドリンク1杯 無料" },
    { rank: "A", min: 800,  color: "#cc3361", title: "すごい！",         prize: "ドリンク 100円引き" },
    { rank: "B", min: 400,  color: "#6c63ff", title: "いい感じ！",       prize: "クッキー1枚 プレゼント" },
    { rank: "C", min: 0,    color: "#3fb8a5", title: "ナイスチャレンジ！", prize: "オリジナルステッカー" }
  ],
  prizeNote: "この画面をスタッフに見せてね",  // 景品の下に出す一文
  // 見本の注意書き（スタート画面と、結果画面の景品の欄に出す）。実際のお店で使うときは "" にすると消えます
  sampleNote: "※ 架空のお店の見本です",

  // ---- 画面の文 ----
  // {time} は制限時間の数、{n} はコンボの数に置きかわります
  texts: {
    rule: "{time}秒で 星をたくさんタップしよう！", // スタート画面の説明（{time} は太字で出ます）
    ruleNote: "星を取りのがすと コンボが切れるよ",
    legendStar: "星",                // スタート画面の、点数の説明の名前
    legendGold: "金の星",
    legendCloud: "黒い雲",
    start: "スタート",               // スタートボタン
    bestLabel: "自己ベスト",         // スタート画面の「自己ベスト ○ 点」
    pointUnit: "点",
    hudScore: "スコア",              // 遊んでいる間の、上の表示
    hudCombo: "コンボ",
    hudTime: "のこり",
    secUnit: "秒",
    go: "スタート！",                // 画面の真ん中に大きく出る文
    lastSpurt: "ラストスパート！",
    finish: "しゅうりょう！",
    comboUp: "{n}コンボ！",          // コンボで倍率が上がったとき（後ろに「×1.5」などが付きます）
    miss: "おしい！",                // 星を取りのがしたとき
    resultTitle: "けっか発表",       // 結果画面
    newBest: "自己ベスト更新！",
    statBest: "自己ベスト",
    statCombo: "最大コンボ",
    statHits: "タッチした星",
    prizeLabel: "景品",
    retry: "もう一度あそぶ"
  },

  // ---- その他 ----
  credit: "Sample by Ryvona",                // 画面の隅に出す小さな文字
  storageKey: "hoshinouta-cafe-time-attack-best" // 自己ベストを保存する名前（お店ごとに変える）
};
</script>

<script id="game-logic">
/* =====================================================================
   ゲームの計算（画面に依存しない小さな関数。node でも試せます）
   ===================================================================== */
const GameLogic = (function () {
  // 足りない入力や形の違う入力でも、例外を出さず、NaN も返さない
  function isObj(x) { return x !== null && typeof x === "object" && !Array.isArray(x); }
  function isNum(v) { return typeof v === "number" && isFinite(v); }
  function num(v, def) { return isNum(v) ? v : def; }
  function has(o, k) { return isObj(o) && Object.prototype.hasOwnProperty.call(o, k); }
  // 状態を正しい形にそろえる（点数・コンボは 0 以上の数）
  function cleanState(state) {
    var st = isObj(state) ? state : {};
    return { score: Math.max(0, num(st.score, 0)), combo: Math.max(0, Math.floor(num(st.combo, 0))), maxCombo: Math.max(0, num(st.maxCombo, 0)) };
  }

  // コンボ数から倍率を出す
  function comboMultiplier(combo, comboCfg) {
    if (!(combo > 0)) return 1;
    var cc = isObj(comboCfg) ? comboCfg : {};
    var step = Math.max(1, Math.floor(num(cc.step, 1)));
    var bonus = Math.max(0, num(cc.bonus, 0));
    var maxM = Math.max(1, num(cc.maxMultiplier, 1));
    var m = 1 + Math.floor(combo / step) * bonus;
    if (!(m >= 1)) m = 1;
    return Math.min(m, maxM);
  }

  // ターゲットに当てたときの新しい状態を返す（元の state は変えない）
  function applyHit(state, type, cfg) {
    var st = cleanState(state);
    var pts = isObj(cfg) && isObj(cfg.points) ? cfg.points : {};
    var base = has(pts, type) ? pts[type] : undefined;
    if (!isNum(base)) {
      return { score: st.score, combo: st.combo, maxCombo: st.maxCombo, gained: 0, multiplier: 1 };
    }
    if (type === "cloud" || base < 0) {
      // 雲（または減点の物）：点数に関係なくコンボは切れる。点数は 0 より下がらない
      // gained は実際に変わった点数（残り20点で -30 なら -20、0点なら 0）
      var score = Math.max(0, st.score + base);
      return { score: score, combo: 0, maxCombo: st.maxCombo, gained: score - st.score, multiplier: 1 };
    }
    var combo = st.combo + 1;
    var multiplier = comboMultiplier(combo, cfg.combo);
    var gained = Math.round(base * multiplier);
    return {
      score: st.score + gained,
      combo: combo,
      maxCombo: Math.max(st.maxCombo, combo),
      gained: gained,
      multiplier: multiplier
    };
  }

  // 星を取り逃したとき：コンボだけ切れる
  function applyMiss(state) {
    var st = cleanState(state);
    return { score: st.score, combo: 0, maxCombo: st.maxCombo, gained: 0, multiplier: 1 };
  }

  // 点数からランクを決める（ranks の並び順に関係なく、min が高い順に判定）
  // min が数でないランクは使わない。使えるランクが無ければ null
  function getRank(score, ranks) {
    if (!Array.isArray(ranks)) return null;
    var list = ranks.filter(function (r) { return isObj(r) && isNum(r.min); });
    if (!list.length) return null;
    var s = num(score, 0);
    var sorted = list.sort(function (a, b) { return b.min - a.min; });
    for (var i = 0; i < sorted.length; i++) {
      if (s >= sorted[i].min) return sorted[i];
    }
    return sorted[sorted.length - 1];
  }

  // 0 以上 1 未満の乱数 r から、出すターゲットの種類を決める
  // r が数でない・範囲の外のときは、ふつうの星にする
  function pickType(r, spawnCfg) {
    if (typeof r !== "number" || !(r >= 0 && r < 1)) return "star";
    var sc = isObj(spawnCfg) ? spawnCfg : {};
    var gold = Math.max(0, num(sc.goldRate, 0)), cloud = Math.max(0, num(sc.cloudRate, 0));
    if (r < gold) return "gold";
    if (r < gold + cloud) return "cloud";
    return "star";
  }

  // 設定を確かめる。間違いの説明（日本語の文）の配列を返す。空なら問題なし
  function checkConfig(cfg) {
    var errs = [];
    if (!isObj(cfg)) return ["CONFIG がありません（または形が違います）。"];
    function str(v, name, allowEmpty) {
      if (typeof v !== "string" || (!allowEmpty && v === "")) errs.push(name + "を \"…\" で囲んだ文字で書いてください。");
    }
    // test：正しい値なら true を返す関数。hint：正しい値の説明
    function numOk(v, name, test, hint) {
      if (!isNum(v)) errs.push(name + "が数ではありません（\"\" で囲まずに、数だけを書いてください）。");
      else if (test && !test(v)) errs.push(name + "は " + hint + "にしてください（今は " + v + "）。");
    }
    var pos = function (v) { return v > 0; }, nonNeg = function (v) { return v >= 0; };
    var atLeast1 = function (v) { return v >= 1; }, rate = function (v) { return v >= 0 && v <= 1; };

    str(cfg.shopName, "shopName（店名）", true);
    str(cfg.eventName, "eventName（イベント名）", true);

    if (!isObj(cfg.colors)) errs.push("colors（色）が { … } の形になっていません。");
    else {
      ["main", "sub", "bgTop", "bgBottom", "finalTop", "finalBottom", "gold"].forEach(function (k) {
        str(cfg.colors[k], "colors の " + k + "（色）", false);
      });
      if (!Array.isArray(cfg.colors.stars)) errs.push("colors の stars（星の色）が [ … ] の形になっていません。");
      ["card", "ink", "inkSoft", "minus", "onBg", "onColor"].forEach(function (k) {
        if (cfg.colors[k] !== undefined) str(cfg.colors[k], "colors の " + k + "（色）", false);
      });
    }

    numOk(cfg.timeLimit, "timeLimit（制限時間）", pos, "0 より大きい数");
    numOk(cfg.finalSeconds, "finalSeconds（ラストスパートの秒数）", nonNeg, "0 以上");

    if (!isObj(cfg.points)) errs.push("points（点数）が { … } の形になっていません。");
    else {
      numOk(cfg.points.star, "points の star（星の点数）");
      numOk(cfg.points.gold, "points の gold（金の星の点数）");
      numOk(cfg.points.cloud, "points の cloud（黒い雲の点数）");
    }

    if (!isObj(cfg.combo)) errs.push("combo（コンボ）が { … } の形になっていません。");
    else {
      numOk(cfg.combo.step, "combo の step（何コンボごとか）", atLeast1, "1 以上");
      numOk(cfg.combo.bonus, "combo の bonus（上がる倍率）", nonNeg, "0 以上");
      numOk(cfg.combo.maxMultiplier, "combo の maxMultiplier（倍率の上限）", atLeast1, "1 以上");
    }

    if (!isObj(cfg.spawn)) errs.push("spawn（出てくる頻度と速さ）が { … } の形になっていません。");
    else {
      var sp = cfg.spawn;
      numOk(sp.interval, "spawn の interval（出る間隔）", pos, "0 より大きい数");
      numOk(sp.finalInterval, "spawn の finalInterval（ラストスパート中の出る間隔）", pos, "0 より大きい数");
      numOk(sp.life, "spawn の life（画面にいる時間）", pos, "0 より大きい数");
      numOk(sp.finalLife, "spawn の finalLife（ラストスパート中の画面にいる時間）", pos, "0 より大きい数");
      numOk(sp.speed, "spawn の speed（動く速さ）", nonNeg, "0 以上");
      numOk(sp.finalSpeed, "spawn の finalSpeed（ラストスパート中の動く速さ）", nonNeg, "0 以上");
      numOk(sp.maxOnScreen, "spawn の maxOnScreen（同時に出る数）", atLeast1, "1 以上");
      numOk(sp.goldRate, "spawn の goldRate（金の星の割合）", rate, "0 から 1 の間");
      numOk(sp.cloudRate, "spawn の cloudRate（黒い雲の割合）", rate, "0 から 1 の間");
      if (isNum(sp.goldRate) && isNum(sp.cloudRate) && sp.goldRate + sp.cloudRate > 1) {
        errs.push("spawn の goldRate と cloudRate の合計は 1 以下にしてください（今は " + (sp.goldRate + sp.cloudRate) + "）。");
      }
    }

    if (!Array.isArray(cfg.ranks) || !cfg.ranks.length) {
      errs.push("ranks（景品ランク）が1つもありません。少なくとも1つ書いてください。");
    } else {
      cfg.ranks.forEach(function (r, i) {
        var at = "ranks の " + (i + 1) + " 番目";
        if (!isObj(r)) { errs.push(at + "が { … } の形になっていません。"); return; }
        str(r.rank, at + "の rank（ランクの文字）", false);
        numOk(r.min, at + "の min（点数）");
        str(r.prize, at + "の prize（景品）", true);
        if (r.title !== undefined) str(r.title, at + "の title（見出し）", true);
        if (r.color !== undefined) str(r.color, at + "の color（色）", false);
      });
    }

    ["prizeNote", "sampleNote", "credit"].forEach(function (k) {
      if (cfg[k] !== undefined) str(cfg[k], k, true);
    });
    str(cfg.storageKey, "storageKey（保存する名前）", false);
    if (cfg.texts !== undefined && !isObj(cfg.texts)) errs.push("texts（画面の文）が { … } の形になっていません。");
    return errs;
  }

  // 自己ベスト更新か
  function isNewBest(score, best) {
    return isNum(score) && score > 0 && score > num(best, 0);
  }

  return { comboMultiplier: comboMultiplier, applyHit: applyHit, applyMiss: applyMiss,
           getRank: getRank, pickType: pickType, isNewBest: isNewBest, checkConfig: checkConfig };
})();
if (typeof module !== "undefined" && module.exports) { module.exports = GameLogic; }
</script>

<style>
  :root {
    --main: #cc3361;
    --sub: #6c63ff;
    --bg1: #2b2a6b;
    --bg2: #7a5cc7;
    --final1: #5a1e4a;
    --final2: #ff7a59;
    --ink: #2d2346;
    --ink-soft: #4a3f66;
    --minus: #5a4d7a;
    --card: #fff;      /* カードの地（94% で重ねて、少し透けさせる） */
    --on-bg: #fff;     /* 背景の上の文字 */
    --on-color: #fff;  /* 色の付いたボタン・札の上の文字 */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    position: fixed; inset: 0;
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Meiryo", system-ui, sans-serif; /* 端末にある字体だけを使う（丸い字体を優先） */
    color: var(--on-bg);
    background-color: var(--bg1);
    background-image: linear-gradient(180deg, var(--bg1), var(--bg2));
    touch-action: manipulation;
    user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* ラストスパート用の背景（重ねて透明度で切り替え） */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, var(--final1), var(--final2));
    opacity: 0; transition: opacity .9s ease;
  }
  body.final::before { opacity: 1; }

  #field { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; touch-action: none; }
  #flash {
    position: fixed; inset: 0; z-index: 4; pointer-events: none; opacity: 0;
    background: radial-gradient(circle at center, rgba(255,40,90,0) 35%, rgba(255,40,90,.6) 100%);
    transition: opacity .35s ease;
  }
  #flash.on { opacity: 1; transition: none; }

  /* ---------- 画面上部の表示（スコア・コンボ・時間） ---------- */
  #hud {
    position: fixed; left: 0; right: 0; top: 0; z-index: 5; pointer-events: none;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 6px;
    transition: opacity .3s ease, transform .3s ease;
  }
  #hud.off { opacity: 0; transform: translateY(-12px); }
  .hud-row {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
    max-width: 560px; margin: 0 auto;
  }
  .hud-box {
    background: color-mix(in srgb, var(--on-bg) 16%, transparent);
    border: 2px solid color-mix(in srgb, var(--on-bg) 30%, transparent);
    border-radius: 18px;
    padding: 5px 6px 6px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    line-height: 1.05;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .hud-label { font-size: 11px; font-weight: 800; letter-spacing: .08em; opacity: .85; }
  .hud-val { font-size: 28px; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: .01em; }
  .hud-val small { font-size: 14px; font-weight: 800; margin-left: 2px; }
  #comboBox.hot { background: color-mix(in srgb, var(--sub) 55%, transparent); border-color: rgba(255,255,255,.7); }
  #mult { color: #ffe066; }
  .bar {
    max-width: 560px; margin: 8px auto 0; height: 14px; border-radius: 99px; overflow: hidden;
    background: rgba(0,0,0,.28); border: 2px solid color-mix(in srgb, var(--on-bg) 35%, transparent);
  }
  #barFill {
    height: 100%; width: 100%; border-radius: 99px; transform-origin: left center;
    background: linear-gradient(90deg, var(--sub), var(--main));
  }

      ctx.beginPath(); ctx.arc(-s * 0.17, 0, s * 0.03, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(s * 0.23, 0, s * 0.03, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-s * 0.12, s * 0.16); ctx.quadraticCurveTo(0, s * 0.31, s * 0.12, s * 0.16); ctx.stroke();
    }
  }
  function drawStar(t, R) {
    var isGold = t.type === "gold";
    if (isGold) {
      var halo = ctx.createRadialGradient(0, 0, R * 0.3, 0, 0, R * 1.8);
      halo.addColorStop(0, "rgba(255,220,80,.55)"); halo.addColorStop(1, "rgba(255,220,80,0)");
      ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(0, 0, R * 1.8, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.beginPath(); ctx.arc(0, 0, R * 1.25, 0, Math.PI * 2); ctx.fill();
    }
    var fill;
    if (isGold) {
      fill = ctx.createLinearGradient(0, -R, 0, R);
      fill.addColorStop(0, "#fff3a0"); fill.addColorStop(0.55, C.colors.gold); fill.addColorStop(1, "#ff9d00");
    } else fill = t.color;
    traceStar(0, R * 0.06, R, R * 0.5);
    ctx.lineJoin = "round"; ctx.lineWidth = R * 0.26;
    ctx.strokeStyle = fill; ctx.fillStyle = fill; ctx.stroke(); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.38)";
    traceStar(-R * 0.16, -R * 0.2, R * 0.32, R * 0.16); ctx.fill();
    drawFace(R, isGold);
    if (isGold) {
      ctx.fillStyle = "#fff";
      for (var k = 0; k < 3; k++) {
        var ang = clock * 2.2 + k * 2.09, d = R * 1.35, sz = R * (0.16 + 0.06 * Math.sin(clock * 6 + k));
        sparkle(Math.cos(ang) * d, Math.sin(ang) * d, sz);
      }
    }
  }
  function sparkle(x, y, s) {
    ctx.beginPath();
    ctx.moveTo(x, y - s); ctx.lineTo(x + s * 0.28, y - s * 0.28); ctx.lineTo(x + s, y); ctx.lineTo(x + s * 0.28, y + s * 0.28);
    ctx.lineTo(x, y + s); ctx.lineTo(x - s * 0.28, y + s * 0.28); ctx.lineTo(x - s, y); ctx.lineTo(x - s * 0.28, y - s * 0.28);
    ctx.closePath(); ctx.fill();
  }
  var CLOUD_BLOBS = [[-0.5, 0.12, 0.44], [0.5, 0.12, 0.44], [-0.18, -0.2, 0.5], [0.22, -0.12, 0.48], [0, 0.24, 0.48]];
  function drawCloud(t, R) {
    var i, b;
    ctx.fillStyle = "rgba(255,255,255,.7)";
    for (i = 0; i < CLOUD_BLOBS.length; i++) { b = CLOUD_BLOBS[i]; ctx.beginPath(); ctx.arc(b[0] * R, b[1] * R, b[2] * R + 3, 0, Math.PI * 2); ctx.fill(); }
    var g = ctx.createLinearGradient(0, -R * 0.7, 0, R * 0.7);
    g.addColorStop(0, isFinal ? "#5d3b5e" : "#4c4566"); g.addColorStop(1, "#231f30");
    ctx.fillStyle = g;
    for (i = 0; i < CLOUD_BLOBS.length; i++) { b = CLOUD_BLOBS[i]; ctx.beginPath(); ctx.arc(b[0] * R, b[1] * R, b[2] * R, 0, Math.PI * 2); ctx.fill(); }
    ctx.strokeStyle = "#fff"; ctx.fillStyle = "#fff"; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.lineWidth = R * 0.08;
    ctx.beginPath(); ctx.moveTo(-R * 0.34, -R * 0.06); ctx.lineTo(-R * 0.1, R * 0.05); ctx.moveTo(R * 0.34, -R * 0.06); ctx.lineTo(R * 0.1, R * 0.05); ctx.stroke();
    ctx.beginPath(); ctx.arc(-R * 0.17, R * 0.16, R * 0.08, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(R * 0.17, R * 0.16, R * 0.08, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = R * 0.07;
    ctx.beginPath(); ctx.moveTo(-R * 0.2, R * 0.42); ctx.lineTo(-R * 0.1, R * 0.34); ctx.lineTo(0, R * 0.42); ctx.lineTo(R * 0.1, R * 0.34); ctx.lineTo(R * 0.2, R * 0.42); ctx.stroke();
  }

  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);

    // 背景のきらきら
    for (var i = 0; i < ambient.length; i++) {
      var s = ambient[i];
      var al = reduceMotion ? 0.45 : 0.25 + 0.5 * (0.5 + 0.5 * Math.sin(clock * s.sp + s.ph));
      ctx.fillStyle = "rgba(255,255,255," + al.toFixed(3) + ")";
      ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.s, 0, Math.PI * 2); ctx.fill();
    }

    ctx.save();
    if (shake > 0 && !reduceMotion) {
      var k = shake / 0.3 * 10;
      ctx.translate((Math.random() - 0.5) * k, (Math.random() - 0.5) * k);
    }
    for (i = 0; i < targets.length; i++) {
      var t = targets[i], sc = 1, alpha = 1;
      if (!reduceMotion) {
        sc = t.age < 0.28 ? easeOutBack(t.age / 0.28) : 1;
        if (!t.leaving && t.life - t.age < 0.45) sc *= 1 + Math.sin(t.age * 38) * 0.05; // もうすぐ消える合図
      } else if (t.age < 0.15) alpha = t.age / 0.15;
      if (t.leaving) { var q = Math.max(0, 1 - t.leaveAge / 0.22); if (!reduceMotion) sc *= q; alpha *= q; }
      var R = t.r * sc;
      if (R < 0.5 || alpha <= 0) continue;
      ctx.save();
      ctx.globalAlpha = Math.min(1, alpha);
      ctx.translate(t.x, t.y); ctx.rotate(t.rot);
      if (t.type === "cloud") drawCloud(t, R); else drawStar(t, R);
      ctx.restore();
    }
    ctx.restore();

    for (i = 0; i < rings.length; i++) {
      var rg = rings[i], kk = rg.age / rg.life;
      ctx.strokeStyle = "rgba(" + rg.color + "," + (1 - kk).toFixed(3) + ")";
      ctx.lineWidth = rg.w * (1 - kk) + 1;
      ctx.beginPath(); ctx.arc(rg.x, rg.y, 6 + rg.maxR * (1 - Math.pow(1 - kk, 2)), 0, Math.PI * 2); ctx.stroke();
    }
    for (i = 0; i < particles.length; i++) {
      var p = particles[i], pa = 1 - p.age / p.life;
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, pa * 1.5));
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      traceStar(0, 0, p.size, p.size * 0.45); ctx.fill();
      ctx.restore();
    }
    for (i = 0; i < floaters.length; i++) {
      var f = floaters[i], fk = f.age / f.life;
      var fy = f.y - (f.big ? 20 : 46) * (1 - Math.pow(1 - fk, 2));
      var fs = f.size * (f.big && !reduceMotion ? (fk < 0.2 ? 0.6 + 2 * fk : 1) : 1);
      ctx.save();
      ctx.globalAlpha = fk > 0.6 ? Math.max(0, 1 - (fk - 0.6) / 0.4) : 1;
      ctx.font = "900 " + Math.round(fs) + 'px "Hiragino Maru Gothic ProN", "Hiragino Sans", "Meiryo", system-ui, sans-serif';
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.lineJoin = "round"; ctx.lineWidth = Math.max(4, fs * 0.2); ctx.strokeStyle = "rgba(40,25,70,.75)";
      ctx.strokeText(f.text, f.x, fy);
      ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, fy);
      ctx.restore();
    }
  }

  var lastT = performance.now();
  function frame(now) {
    var dt = (now - lastT) / 1000; lastT = now;
    if (!(dt > 0)) dt = 0;
    if (dt > 0.1) dt = 0.1; // タブを離れた間などに、時間が一気に進まないように
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------- スクロール・拡大・長押しメニューを防ぐ ---------- */
  document.addEventListener("touchmove", function (e) {
    if (!(e.target.closest && e.target.closest(".card"))) e.preventDefault();
  }, { passive: false });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
})();
</script>
</body>
</html>
